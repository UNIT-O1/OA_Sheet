        }

            font-weight: bold;
            color: #000000;
            margin: 2px 0 6px 0;
            font-family: monospace;
        }

        .stat-bar-container {
            background: #e0e0e0;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: #7bf07d;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* CSES Section Title */
        .topic-title {
            font-size: 22px;
            font-weight: bold;
            color: #000000;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        /* CSES Table */
        table.cses-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            border-top: 1px solid #d0d0d0;
        }

        table.cses-table tr {
            border-bottom: 1px solid #e0e0e0;
        }

        table.cses-table th {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #555555;
            padding: 4px 6px;
            background: #f0f0f0;
            border-left: 1px solid #ffffff;
            text-transform: uppercase;
        }

        table.cses-table th.th-title {
            text-align: left;
            padding-left: 8px;
        }

            padding: 6px 8px;
            vertical-align: middle;
        }

        .doc-icon {
            font-size: 14px;
            margin-right: 6px;
            color: #000000;
        }

        .prob-link {
            color: #0000ee;
            text-decoration: underline;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;

        td.status-cell {

        }

const STORAGE_KEY = "dsa_tracker_progress_v1";

function loadProgress() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
}

function toggleStatus(id, key) {
    const progress = loadProgress();
    if (!progress[id]) progress[id] = {};
    progress[id][key] = !progress[id][key];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));

    // Update DOM status cell
    const cell = document.getElementById(`cell-${id}-${key}`);
    if (cell) {
        if (progress[id][key]) {
            cell.className = "status-cell checked";
            cell.innerText = "✓";
        } else {
            cell.className = "status-cell unchecked";
            cell.innerText = "-";
        }
    }

    updateStats();
}

function resetProgress() {
    if (confirm("Are you sure you want to reset all progress? This action cannot be undone.")) {
        localStorage.removeItem(STORAGE_KEY);
        renderTracker();
        updateStats();
    }
}

function renderTracker() {
    const container = document.getElementById("cses-container");
    container.innerHTML = "";
    const progress = loadProgress();

    dataset.forEach(topic => {
        const topicSection = document.createElement("div");
        topicSection.className = "topic-section";

        let tableHtml = `
            <div class="topic-title">${topic.topic}</div>
            <table class="cses-table">
                <thead>
                    <tr>
                        <th class="th-title">Task Title</th>
                        <th>SOLVED</th>
                        <th>CODE</th>
                        <th>R1</th>
                        <th>R2</th>
                        <th>R3</th>
                    </tr>
                </thead>
                <tbody>
        `;

        topic.questions.forEach(q => {
            const p = progress[q.id] || {};
            const slug = q.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            const lcUrl = `https://leetcode.com/problems/${slug}/`;
            const keys = ['s', 'c', 'r1', 'r2', 'r3'];

            tableHtml += `
                <tr>
                    <td>
                        <span class="doc-icon">🗎</span>
                        <a href="${lcUrl}" target="_blank" class="prob-link">${q.name}</a>
                        <span class="lc-id">#${q.id}</span>
                    </td>
                    ${keys.map(k => `
                        <td 
                            id="cell-${q.id}-${k}" 
                            class="status-cell ${p[k] ? 'checked' : 'unchecked'}" 
                            onclick="toggleStatus(${q.id}, '${k}')"
                            title="Click to toggle status"
                        >
                            ${p[k] ? '✓' : '-'}
                        </td>
                    `).join('')}
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        topicSection.innerHTML = tableHtml;
        container.appendChild(topicSection);
    });

    updateStats();
}

function updateStats() {
    const progress = loadProgress();
    let solvedCount = 0, codedCount = 0, revisedCount = 0;

    Object.values(progress).forEach(p => {
        if (p.s) solvedCount++;
        if (p.c) codedCount++;
        if (p.r1 && p.r2 && p.r3) revisedCount++;
    });

    document.getElementById("stat-solved").innerText = `${solvedCount} / 180`;
    document.getElementById("stat-coded").innerText = `${codedCount} / 180`;
    document.getElementById("stat-revised").innerText = `${revisedCount} / 180`;

    document.getElementById("progress-solved").style.width = `${(solvedCount / 180) * 100}%`;
    document.getElementById("progress-coded").style.width = `${(codedCount / 180) * 100}%`;
    document.getElementById("progress-revised").style.width = `${(revisedCount / 180) * 100}%`;
}

renderTracker();
</script>
</body>
</html>
